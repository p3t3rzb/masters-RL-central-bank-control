name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.2 check src tests
      - run: uvx ruff@0.17.2 format --check src tests
      - run: uvx complexipy@8.1.0 -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # CPU-only torch keeps the install small; no test needs a GPU.
      - run: uv sync --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - run: uv run mypy
      - run: uv run pytest tests/unit tests/integration
