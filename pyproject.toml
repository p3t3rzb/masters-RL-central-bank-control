[project]
name = "masters-godley"
version = "0.1.0"
description = "SFC ground-truth economic models and learned proxy surrogates (master's thesis)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "optuna>=4.0",
    "pysolve>=0.2.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "complexipy>=8.1.0",
    "mypy>=2.4.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/economic_models", "src/data_generation", "src/control", "src/parallel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files share a basename across tiers without
# ``__init__.py`` packages in every directory.
addopts = ["--import-mode=importlib", "-ra"]
markers = [
    "unit: one component in isolation, no model solved (tests/unit)",
    "integration: real models and fitted proxies at small sizes (tests/integration)",
    "e2e: whole pipelines, training and dataset generation (tests/e2e)",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# Long lines the formatter cannot split (strings, URLs, comments) are left alone.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["economic_models", "data_generation", "control", "parallel"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pysolve.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15
